<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CosmoChat Sky</title>
    <!-- Bibliotheken: Socket.io, Tailwind CSS, FontAwesome -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #f0f9ff; 
            color: #0c4a6e; 
            height: 100vh; 
            display: flex; 
            overflow: hidden; 
        }
        /* Sidebar in hellem Blau */
        .side-nav { 
            background-color: #e0f2fe; 
            width: 320px; 
            border-right: 2px solid #bae6fd; 
            flex-shrink: 0; 
        }
        /* Nachrichtendesign */
        .msg-user { 
            background-color: #0ea5e9; 
            color: white; 
            border-radius: 20px 20px 0 20px; 
        }
        .msg-other { 
            background-color: #e2e8f0; 
            color: #1e293b; 
            border-radius: 20px 20px 20px 0; 
        }
        /* Lila Roboter Button */
        .ai-robot-btn { 
            background-color: #a855f7; 
            color: white; 
            transition: all 0.2s; 
        }
        .ai-robot-btn:hover { 
            background-color: #9333ea; 
            transform: scale(1.1); 
        }
        /* Scrollbar Styling */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #bae6fd; border-radius: 10px; }
        
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .side-nav { width: 100%; height: auto; }
        }
    </style>
</head>
<body class="w-full">

    <!-- Navigation / Sidebar -->
    <nav class="side-nav p-6 flex flex-col h-1/4 md:h-full overflow-y-auto">
        <h1 class="text-3xl font-black text-sky-600 italic mb-4 flex items-center gap-2">
            <i class="fa-solid fa-cloud"></i> CosmoChat
        </h1>
        
        <div id="idBadge" class="bg-white/80 p-3 rounded-2xl font-bold text-center mb-6 text-sky-700 border border-sky-200 text-xs tracking-widest uppercase">
            ID: LÄDT...
        </div>
        
        <div class="mt-auto bg-sky-200/50 p-4 rounded-2xl">
            <p class="text-[10px] font-bold text-sky-500 uppercase mb-1">KI-Assistent</p>
            <p class="text-xs text-sky-700 font-medium">Nutze den lila 🤖 Button für Gemini-Antworten!</p>
        </div>
    </nav>

    <!-- Main Chat Container -->
    <main class="flex-1 flex flex-col bg-white">
        <!-- Message Window -->
        <div id="messageDisplay" class="flex-1 overflow-y-auto p-4 md:p-8 space-y-4 bg-slate-50/30">
            <!-- Messages load here -->
        </div>

        <!-- Input Bar -->
        <footer class="p-4 md:p-6 border-t-2 border-sky-50 flex items-center gap-3 bg-white">
            <!-- Gemini Button -->
            <button onclick="requestAIResponse()" title="Gemini fragen" class="ai-robot-btn w-14 h-14 rounded-2xl flex items-center justify-center shadow-lg shrink-0">
                <i class="fa-solid fa-robot text-xl"></i>
            </button>
            
            <input type="text" id="messageInput" placeholder="Nachricht schreiben..." 
                class="flex-1 p-5 bg-slate-100 rounded-2xl outline-none focus:bg-white focus:ring-4 focus:ring-sky-100 transition-all text-slate-700 shadow-inner">
            
            <button onclick="dispatchMessage()" class="bg-sky-500 text-white h-14 px-8 rounded-2xl font-black shadow-lg hover:bg-sky-600 transition-all active:scale-95">
                SENDEN
            </button>
        </footer>
    </main>

    <script>
        // Nutzt die von dir bereitgestellte URL
        const socket = io('https://cosmochat-1052534417422.europe-west1.run.app');
        const display = document.getElementById('messageDisplay');
        const input = document.getElementById('messageInput');
        let currentUserId = localStorage.getItem('cosmo_id_v4');

        socket.on('connect', () => {
            socket.emit('user_connect', { id: currentUserId });
            socket.emit('load_history');
        });

        socket.on('init_data', (data) => {
            currentUserId = data.id;
            localStorage.setItem('cosmo_id_v4', data.id);
            document.getElementById('idBadge').textContent = "ID: " + data.id;
        });

        socket.on('chat_history', (messages) => {
            display.innerHTML = '';
            messages.forEach(msg => renderMessage(msg));
        });

        socket.on('receive_message', (msg) => {
            renderMessage(msg);
        });

        function dispatchMessage() {
            const val = input.value.trim();
            if (!val) return;
            socket.emit('send_message', { text: val });
            input.value = '';
        }

        function requestAIResponse() {
            const val = input.value.trim();
            if (!val) {
                alert("Bitte gib erst eine Frage in das Textfeld ein!");
                return;
            }
            socket.emit('ask_ai', { text: val });
            input.value = '';
        }

        function renderMessage(msg) {
            const isMe = msg.from_id === currentUserId;
            const isAI = msg.from_id === 'ai_bot';
            
            const wrapper = document.createElement('div');
            wrapper.className = `flex w-full ${isMe ? 'justify-end' : 'justify-start'}`;
            
            const bubbleStyle = isMe ? 'msg-user' : (isAI ? 'bg-purple-100 border-2 border-purple-200 text-purple-900 rounded-2xl' : 'msg-other');

            wrapper.innerHTML = `
                <div class="max-w-[85%] md:max-w-[70%] p-4 shadow-sm ${bubbleStyle}">
                    <div class="flex justify-between items-center mb-1 gap-4 opacity-40 text-[9px] font-black uppercase">
                        <span>${isMe ? 'Du' : (isAI ? 'CosmoAI 🤖' : 'Nutzer')}</span>
                        <span>${msg.time || ''}</span>
                    </div>
                    <p class="text-sm md:text-base leading-relaxed">${msg.text}</p>
                </div>
            `;
            display.appendChild(wrapper);
            display.scrollTo({ top: display.scrollHeight, behavior: 'smooth' });
        }

        input.onkeypress = (e) => { if(e.key === 'Enter') dispatchMessage(); };
    </script>
</body>
</html>
