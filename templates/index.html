<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CosmoChat</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: white; font-family: sans-serif; overflow: hidden; height: 100vh; display: flex; }
        
        /* Sidebar Styling */
        .sidebar { width: 300px; background: #1e293b; border-right: 1px solid #334155; display: flex; flex-direction: column; }
        
        /* Chat Area Styling */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #0f172a; position: relative; }
        
        /* Nachrichten Bubbles */
        .msg { max-width: 70%; padding: 10px 14px; border-radius: 12px; margin-bottom: 4px; font-size: 14px; }
        .msg-me { background: #10b981; align-self: flex-end; color: white; border-top-right-radius: 0; }
        .msg-other { background: #334155; align-self: flex-start; color: white; border-top-left-radius: 0; }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 5px; }

        @media (max-width: 768px) {
            .sidebar { display: none; width: 100%; }
            .sidebar.active { display: flex; }
            .chat-area.hidden { display: none; }
        }
    </style>
</head>
<body>

    <!-- Sidebar: Freunde & ID -->
    <div id="sidebar" class="sidebar">
        <div class="p-4 border-b border-gray-700 bg-gray-800">
            <h1 class="text-xl font-bold text-emerald-400 mb-2">CosmoChat</h1>
            <div class="bg-gray-900 p-2 rounded text-center">
                <span class="text-xs text-gray-500 uppercase">Deine ID</span>
                <div id="myIdDisplay" class="text-lg font-mono font-bold tracking-widest text-white">------</div>
            </div>
        </div>
        
        <div class="p-4 border-b border-gray-700">
            <div class="flex gap-2">
                <input type="text" id="friendInput" placeholder="6-stellige ID..." class="w-full bg-gray-700 border-none rounded p-2 text-sm text-white focus:ring-2 focus:ring-emerald-500 outline-none">
                <button onclick="addFriend()" class="bg-emerald-600 px-3 rounded text-white hover:bg-emerald-500"><i class="fa-solid fa-plus"></i></button>
            </div>
        </div>

        <div id="friendsList" class="flex-1 overflow-y-auto p-2 space-y-1">
            <!-- Freundesliste wird hier geladen -->
        </div>
    </div>

    <!-- Chat Bereich -->
    <div id="chatArea" class="chat-area">
        <!-- Header -->
        <div class="h-16 border-b border-gray-800 bg-gray-800 flex items-center px-4 justify-between">
            <div class="flex items-center gap-3">
                <button class="md:hidden text-gray-400" onclick="toggleView()"><i class="fa-solid fa-arrow-left"></i></button>
                <div id="chatTitle" class="font-bold">Kein Chat ausgewählt</div>
            </div>
            <div id="callButtons" class="flex gap-4 opacity-50 pointer-events-none">
                <button onclick="startCall('audio')" class="text-gray-400 hover:text-white"><i class="fa-solid fa-phone"></i></button>
                <button onclick="startCall('video')" class="text-gray-400 hover:text-white"><i class="fa-solid fa-video"></i></button>
            </div>
        </div>

        <!-- Nachrichten -->
        <div id="messages" class="flex-1 overflow-y-auto p-4 flex flex-col gap-2">
            <div class="flex h-full items-center justify-center text-gray-500 text-sm">
                Wähle einen Freund aus, um zu chatten.
            </div>
        </div>

        <!-- Eingabe -->
        <div class="p-4 bg-gray-800 border-t border-gray-700 flex gap-2">
            <button onclick="askAI()" class="w-10 h-10 rounded-full bg-purple-600 text-white flex items-center justify-center hover:bg-purple-500"><i class="fa-solid fa-robot"></i></button>
            <input type="text" id="msgInput" placeholder="Nachricht..." class="flex-1 bg-gray-700 rounded-full px-4 text-white outline-none focus:ring-1 focus:ring-emerald-500">
            <button onclick="sendMessage()" class="w-10 h-10 rounded-full bg-emerald-600 text-white flex items-center justify-center hover:bg-emerald-500"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        const socket = io();
        let myId = localStorage.getItem('cosmo_id');
        let currentRoom = null;

        // Verbindung herstellen
        socket.on('connect', () => {
            socket.emit('login', { id: myId });
        });

        // Eigene ID empfangen
        socket.on('init_data', (data) => {
            myId = data.id;
            localStorage.setItem('cosmo_id', myId);
            document.getElementById('myIdDisplay').textContent = myId;
            renderFriends(data.friends);
        });

        // Freund hinzugefügt
        socket.on('friend_added', (friend) => {
            // Seite neu laden oder Liste updaten wäre besser, hier einfach alert
            alert("Freund " + friend.name + " hinzugefügt!");
            location.reload(); 
        });

        // Nachricht empfangen
        socket.on('new_message', (msg) => {
            if (currentRoom === msg.room) {
                renderMessage(msg);
            }
        });

        // Chat Historie laden
        socket.on('chat_history', (data) => {
            currentRoom = data.room;
            const msgsDiv = document.getElementById('messages');
            msgsDiv.innerHTML = '';
            
            data.messages.forEach(m => renderMessage(m));
            
            document.getElementById('chatTitle').textContent = "Chat";
            document.getElementById('callButtons').classList.remove('opacity-50', 'pointer-events-none');
            
            // Mobile View anpassen
            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('active');
                document.getElementById('chatArea').classList.remove('hidden');
            }
        });

        function addFriend() {
            const id = document.getElementById('friendInput').value;
            if (id.length === 6) {
                socket.emit('add_friend', { friend_id: id });
                document.getElementById('friendInput').value = '';
            } else {
                alert("Die ID muss 6-stellig sein.");
            }
        }

        function openChat(friendId, friendName) {
            socket.emit('join_chat', { target_id: friendId });
            document.getElementById('chatTitle').textContent = friendName;
        }

        function sendMessage() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (text && currentRoom) {
                socket.emit('send_message', { text: text, room: currentRoom });
                input.value = '';
            }
        }
        
        function askAI() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (text && currentRoom) {
                socket.emit('send_message', { text: "@ai " + text, room: currentRoom });
                input.value = '';
            } else {
                alert("Schreibe erst eine Frage!");
            }
        }

        function renderMessage(msg) {
            const div = document.createElement('div');
            const isMe = msg.from === myId;
            const isAI = msg.from === 'ai';
            
            div.className = `msg ${isMe ? 'msg-me' : isAI ? 'bg-purple-600 text-white self-start' : 'msg-other'}`;
            div.innerText = msg.text;
            
            const container = document.getElementById('messages');
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function renderFriends(friends) {
            const list = document.getElementById('friendsList');
            list.innerHTML = '';
            friends.forEach(f => {
                const item = document.createElement('div');
                item.className = 'p-3 bg-gray-800 rounded mb-1 cursor-pointer hover:bg-gray-700 flex justify-between items-center';
                item.innerHTML = `<span class="font-bold">${f.name}</span><span class="text-xs text-gray-500">${f.id}</span>`;
                item.onclick = () => openChat(f.id, f.name);
                list.appendChild(item);
            });
        }

        function toggleView() {
            document.getElementById('sidebar').classList.add('active');
            document.getElementById('chatArea').classList.add('hidden');
        }

        function startCall(type) {
            alert(type === 'video' ? "Videoanruf startet..." : "Sprachanruf startet...");
        }

        // Mobile Initial State
        if (window.innerWidth <= 768) {
             document.getElementById('sidebar').classList.add('active');
             document.getElementById('chatArea').classList.add('hidden');
        }
    </script>
</body>
</html>
