<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CosmoChat Enterprise</title>
    
    <!-- Core Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* Design System Variables */
        :root {
            --primary: #0ea5e9; 
            --bg-dark: #0f172a;
            --panel: #1e293b;
            --border: #334155;
            --text-main: #f1f5f9;
            --text-mute: #94a3b8;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-main);
            height: 100vh; 
            overflow: hidden; 
            display: flex;
        }

        /* Layout Architecture */
        .app-container { display: flex; width: 100%; height: 100%; position: relative; }
        
        .sidebar { 
            width: 380px; 
            background: var(--panel); 
            border-right: 1px solid var(--border); 
            display: flex; 
            flex-direction: column; 
            flex-shrink: 0;
            z-index: 20;
        }

        .chat-area { 
            flex: 1; 
            background: #0b1120; 
            position: relative; 
            display: flex; 
            flex-direction: column; 
            z-index: 10;
        }

        .chat-area::before {
            content: ""; position: absolute; inset: 0; opacity: 0.03; pointer-events: none;
            background-image: url('https://www.transparenttextures.com/patterns/cubes.png');
        }

        /* UI Components */
        .search-bar {
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 15px;
        }

        .contact-item {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: 0.2s;
            border-bottom: 1px solid rgba(255,255,255,0.02);
        }
        .contact-item:hover { background: rgba(255,255,255,0.05); }
        .contact-item.active { background: rgba(14, 165, 233, 0.15); border-left: 4px solid var(--primary); }

        .avatar {
            width: 45px; height: 45px; 
            border-radius: 50%; 
            background: linear-gradient(135deg, #6366f1, #3b82f6);
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 18px; color: white;
            flex-shrink: 0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* Message Bubbles */
        .msg-container {
            flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px;
        }

        .msg {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.5;
            position: relative;
            word-wrap: break-word;
            animation: slideUp 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .msg-me { background: var(--primary); color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg-other { background: var(--panel); color: white; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid var(--border); }
        .msg-ai { background: linear-gradient(135deg, #7c3aed, #4f46e5); color: white; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #a78bfa; }
        .msg-sys { align-self: center; background: rgba(255,255,255,0.1); font-size: 12px; padding: 4px 12px; border-radius: 20px; color: var(--text-mute); }

        .img-msg { max-width: 100%; border-radius: 12px; margin-top: 5px; cursor: pointer; border: 2px solid rgba(255,255,255,0.2); transition: transform 0.2s; }
        .img-msg:hover { transform: scale(1.02); }

        /* Modals & Overlays */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: 0.3s;
            backdrop-filter: blur(5px);
        }
        .modal-overlay.open { opacity: 1; pointer-events: all; }
        
        .modal-box {
            background: var(--panel); width: 90%; max-width: 400px; padding: 30px; border-radius: 24px;
            border: 1px solid var(--border); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform: scale(0.95); transition: 0.3s;
        }
        .modal-overlay.open .modal-box { transform: scale(1); }

        /* Loader */
        .loader-screen {
            position: fixed; inset: 0; background: var(--bg-dark); z-index: 200;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.5s;
        }
        .spinner { border: 4px solid rgba(255,255,255,0.1); border-left-color: var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .sidebar { width: 100%; position: absolute; height: 100%; }
            .sidebar.hidden { transform: translateX(-100%); }
            .chat-area { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- LOADING SCREEN -->
    <div id="loaderScreen" class="loader-screen">
        <h1 class="text-4xl font-black text-white mb-4 tracking-tighter">COSMOCHAT</h1>
        <div class="spinner"></div>
        <p class="text-gray-500 text-xs mt-4 font-mono">VERBINDE MIT SATELLIT...</p>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settingsModal" class="modal-overlay">
        <div class="modal-box">
            <h2 class="text-2xl font-bold mb-6 text-white flex items-center gap-2"><i class="fa-solid fa-user-astronaut"></i> Profil</h2>
            <div class="space-y-4">
                <div>
                    <label class="text-xs font-bold text-sky-400 uppercase tracking-wider">Dein Name</label>
                    <input type="text" id="settingName" class="w-full bg-[#0f172a] border border-slate-600 rounded-xl p-3 text-white mt-1 focus:border-sky-500 outline-none transition">
                </div>
                <div>
                    <label class="text-xs font-bold text-sky-400 uppercase tracking-wider">Status</label>
                    <input type="text" id="settingStatus" class="w-full bg-[#0f172a] border border-slate-600 rounded-xl p-3 text-white mt-1 focus:border-sky-500 outline-none transition">
                </div>
            </div>
            <div class="flex justify-end gap-3 mt-8">
                <button onclick="closeModal('settingsModal')" class="text-slate-400 hover:text-white px-4 py-2 transition">Abbrechen</button>
                <button onclick="saveSettings()" class="bg-sky-600 hover:bg-sky-500 text-white px-6 py-2 rounded-xl font-bold shadow-lg shadow-sky-900/20 transition hover:scale-105">Speichern</button>
            </div>
        </div>
    </div>

    <!-- CREATE GROUP MODAL -->
    <div id="groupModal" class="modal-overlay">
        <div class="modal-box">
            <h2 class="text-xl font-bold mb-4 text-white flex items-center gap-2"><i class="fa-solid fa-users"></i> Neue Gruppe</h2>
            <input type="text" id="groupNameInp" placeholder="Gruppenname..." class="w-full bg-[#0f172a] border border-slate-600 rounded-xl p-3 text-white mb-4 outline-none focus:border-emerald-500 transition">
            <div class="flex justify-end gap-3">
                <button onclick="closeModal('groupModal')" class="text-slate-400 hover:text-white">Zurück</button>
                <button onclick="createGroup()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-2 rounded-xl font-bold shadow-lg transition hover:scale-105">Erstellen</button>
            </div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div class="app-container">
        
        <!-- SIDEBAR -->
        <div id="sidebar" class="sidebar">
            <!-- Header -->
            <div class="p-5 border-b border-slate-700 bg-[#151f32] flex justify-between items-center shadow-md z-20">
                <div class="flex items-center gap-3 cursor-pointer hover:opacity-80 transition" onclick="openModal('settingsModal')">
                    <div class="avatar" id="myAvatar">C</div>
                    <div>
                        <h3 id="myName" class="font-bold text-white text-sm">Lade...</h3>
                        <p id="myID" class="text-[10px] text-emerald-400 font-mono tracking-widest bg-emerald-900/30 px-2 py-0.5 rounded">ID: ------</p>
                    </div>
                </div>
                <div class="flex gap-1">
                    <button onclick="openModal('groupModal')" class="w-8 h-8 rounded-full bg-slate-700 hover:bg-slate-600 text-white flex items-center justify-center transition" title="Gruppe"><i class="fa-solid fa-plus"></i></button>
                    <button onclick="openModal('settingsModal')" class="w-8 h-8 rounded-full bg-slate-700 hover:bg-slate-600 text-white flex items-center justify-center transition" title="Settings"><i class="fa-solid fa-gear"></i></button>
                </div>
            </div>

            <!-- Add Friend -->
            <div class="search-bar">
                <i class="fa-solid fa-user-plus text-slate-500"></i>
                <input type="text" id="friendIdInp" placeholder="ID (6-stellig)..." class="bg-transparent border-none outline-none text-white text-sm w-full font-mono">
                <button onclick="addFriend()" class="text-sky-500 hover:text-sky-400 font-bold text-xs uppercase tracking-wider">Add</button>
            </div>

            <!-- Tabs -->
            <div class="flex px-6 border-b border-slate-800">
                <button onclick="switchTab('friends')" id="tabFriends" class="flex-1 pb-3 text-sm font-bold text-sky-400 border-b-2 border-sky-400 transition">Freunde</button>
                <button onclick="switchTab('groups')" id="tabGroups" class="flex-1 pb-3 text-sm font-bold text-slate-500 hover:text-slate-300 transition">Gruppen</button>
            </div>

            <!-- List -->
            <div id="listContainer" class="flex-1 overflow-y-auto py-2 px-2">
                <!-- Dynamischer Inhalt -->
            </div>
        </div>

        <!-- CHAT AREA -->
        <div id="chatArea" class="chat-area">
            
            <!-- Empty State -->
            <div id="emptyState" class="absolute inset-0 flex flex-col items-center justify-center text-slate-600 z-0">
                <div class="w-24 h-24 bg-slate-800 rounded-full flex items-center justify-center mb-6 shadow-2xl">
                    <i class="fa-solid fa-comments text-4xl text-slate-500"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-400">CosmoChat Enterprise</h2>
                <p class="text-sm mt-2 text-slate-600">Wähle einen Chat oder starte eine neue Konversation.</p>
                <div class="mt-8 flex gap-4 text-xs font-mono text-slate-700">
                    <span><i class="fa-solid fa-lock"></i> Ende-zu-Ende</span>
                    <span><i class="fa-solid fa-cloud"></i> Cloud Sync</span>
                </div>
            </div>

            <!-- Active Chat -->
            <div id="chatInterface" class="hidden flex-col h-full w-full z-10">
                
                <!-- Chat Header -->
                <div class="h-16 bg-[#151f32]/95 backdrop-blur border-b border-slate-800 flex items-center px-6 justify-between shadow-lg z-20">
                    <div class="flex items-center gap-4">
                        <button class="md:hidden text-slate-400 hover:text-white" onclick="toggleSidebar()"><i class="fa-solid fa-arrow-left text-xl"></i></button>
                        <div class="avatar" id="chatHeaderAvatar" style="width: 38px; height: 38px; font-size: 14px;">?</div>
                        <div>
                            <h3 id="chatHeaderName" class="font-bold text-white text-sm">Chat</h3>
                            <div class="flex items-center gap-1.5">
                                <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                                <p class="text-[10px] text-green-400 font-medium">Verbunden</p>
                            </div>
                        </div>
                    </div>
                    <div class="flex gap-4 text-slate-400">
                        <button class="hover:text-white transition w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-700/50"><i class="fa-solid fa-phone"></i></button>
                        <button class="hover:text-white transition w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-700/50"><i class="fa-solid fa-video"></i></button>
                        <button class="hover:text-white transition w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-700/50"><i class="fa-solid fa-ellipsis-vertical"></i></button>
                    </div>
                </div>

                <!-- Messages -->
                <div id="msgContainer" class="msg-container"></div>

                <!-- Input -->
                <div class="p-4 bg-[#151f32] border-t border-slate-800 flex items-end gap-3 z-20">
                    
                    <!-- AI Button -->
                    <button onclick="quickAI()" class="w-11 h-11 rounded-xl bg-gradient-to-br from-purple-600 to-indigo-600 text-white flex items-center justify-center shrink-0 hover:scale-105 transition shadow-lg shadow-purple-900/40 tooltip" title="KI Fragen">
                        <i class="fa-solid fa-robot text-lg"></i>
                    </button>
                    
                    <!-- Attach -->
                    <button class="w-11 h-11 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition flex items-center justify-center shrink-0">
                        <i class="fa-solid fa-paperclip text-lg"></i>
                    </button>

                    <!-- Text Area -->
                    <div class="flex-1 bg-[#0f172a] border border-slate-700 rounded-xl flex items-center px-2 focus-within:border-sky-500/50 transition">
                        <textarea id="msgInput" rows="1" placeholder="Nachricht oder /imagine..." class="w-full bg-transparent text-white p-3 text-sm outline-none resize-none h-11 py-3"></textarea>
                    </div>

                    <!-- Send -->
                    <button onclick="sendMessage()" class="w-11 h-11 rounded-xl bg-sky-600 text-white flex items-center justify-center shrink-0 hover:bg-sky-500 transition shadow-lg shadow-sky-900/40 hover:scale-105 active:scale-95">
                        <i class="fa-solid fa-paper-plane text-sm"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- CORE SYSTEM ---
        const socket = io();
        let myId = localStorage.getItem('cosmo_ent_uid');
        let myName = localStorage.getItem('cosmo_ent_name') || 'Cosmonaut';
        let currentRoom = null;
        let currentTab = 'friends';
        
        // Cache für UI Referenzen
        const ui = {
            loader: document.getElementById('loaderScreen'),
            list: document.getElementById('listContainer'),
            msgContainer: document.getElementById('msgContainer'),
            msgInput: document.getElementById('msgInput'),
            chatInterface: document.getElementById('chatInterface'),
            emptyState: document.getElementById('emptyState'),
            sidebar: document.getElementById('sidebar')
        };

        // --- CONNECTIVITY ---
        socket.on('connect', () => {
            console.log("System verbunden.");
            socket.emit('system_login', { id: myId });
        });

        socket.on('login_success', (data) => {
            // State Update
            myId = data.id;
            myName = data.profile.name || myName;
            localStorage.setItem('cosmo_ent_uid', myId);
            localStorage.setItem('cosmo_ent_name', myName);
            
            // Header Update
            document.getElementById('myID').innerText = "ID: " + myId;
            document.getElementById('myName').innerText = myName;
            document.getElementById('myAvatar').innerText = myName[0].toUpperCase();
            
            // Hide Loader
            ui.loader.style.opacity = '0';
            setTimeout(() => ui.loader.style.display = 'none', 500);
            
            // Render Default List
            renderList(data.friends, 'friends');
        });

        // --- LISTEN LOGIK ---
        socket.on('friend_list_update', (friends) => {
            if(currentTab === 'friends') renderList(friends, 'friends');
        });
        socket.on('group_list_update', (groups) => {
            if(currentTab === 'groups') renderList(groups, 'groups');
        });

        function switchTab(tab) {
            currentTab = tab;
            // UI Toggle
            document.getElementById('tabFriends').className = tab === 'friends' ? "flex-1 pb-3 text-sm font-bold text-sky-400 border-b-2 border-sky-400 transition" : "flex-1 pb-3 text-sm font-bold text-slate-500 hover:text-slate-300 transition";
            document.getElementById('tabGroups').className = tab === 'groups' ? "flex-1 pb-3 text-sm font-bold text-sky-400 border-b-2 border-sky-400 transition" : "flex-1 pb-3 text-sm font-bold text-slate-500 hover:text-slate-300 transition";
            
            // Reload Data
            socket.emit('system_login', { id: myId });
        }

        function renderList(items, type) {
            ui.list.innerHTML = '';
            if(!items || items.length === 0) {
                ui.list.innerHTML = `<div class="text-center text-slate-600 text-sm mt-10 p-4">Keine ${type === 'friends' ? 'Freunde' : 'Gruppen'} gefunden.<br>Nutze + zum Hinzufügen.</div>`;
                return;
            }
            
            items.forEach(item => {
                const el = document.createElement('div');
                el.className = `contact-item ${currentRoom === item.id ? 'active' : ''}`;
                el.onclick = () => openChat(item.id, item.name, type === 'groups');
                
                const icon = type === 'groups' ? '<i class="fa-solid fa-users"></i>' : (item.name[0].toUpperCase());
                const status = item.online ? '<span class="text-green-500 text-[10px]">● Online</span>' : '<span class="text-slate-600 text-[10px]">Offline</span>';
                
                el.innerHTML = `
                    <div class="avatar" style="${type==='groups'?'background: #334155':''}">${icon}</div>
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-baseline">
                            <h4 class="font-bold text-slate-200 truncate text-sm">${item.name}</h4>
                        </div>
                        <div class="text-xs text-slate-500 truncate">${type==='groups' ? 'Gruppe' : status}</div>
                    </div>
                `;
                ui.list.appendChild(el);
            });
        }

        // --- ACTIONS ---
        function addFriend() {
            const id = document.getElementById('friendIdInp').value.trim();
            if(id.length === 6 && id !== myId) {
                socket.emit('add_contact', { target_id: id });
                document.getElementById('friendIdInp').value = '';
            } else { alert("Ungültige ID."); }
        }

        function createGroup() {
            const name = document.getElementById('groupNameInp').value.trim();
            if(name) {
                socket.emit('create_group', { name: name });
                closeModal('groupModal');
                switchTab('groups');
            }
        }

        function saveSettings() {
            const name = document.getElementById('settingName').value.trim();
            if(name) {
                socket.emit('update_profile', { name: name });
                closeModal('settingsModal');
            }
        }

        socket.on('profile_updated', (d) => {
            if(d.name) {
                myName = d.name;
                document.getElementById('myName').innerText = d.name;
                document.getElementById('myAvatar').innerText = d.name[0].toUpperCase();
            }
        });

        // --- CHAT SYSTEM ---
        function openChat(targetId, name, isGroup) {
            currentRoom = null; // Reset
            ui.emptyState.classList.add('hidden');
            ui.chatInterface.classList.remove('hidden');
            
            document.getElementById('chatHeaderName').innerText = name;
            document.getElementById('chatHeaderAvatar').innerText = name[0].toUpperCase();
            
            if(window.innerWidth <= 768) ui.sidebar.classList.add('hidden');

            socket.emit('join_chat', { target_id: targetId, is_group: isGroup });
        }

        function toggleSidebar() {
            ui.sidebar.classList.remove('hidden');
            ui.chatInterface.classList.add('hidden');
        }

        socket.on('chat_ready', (data) => {
            currentRoom = data.room;
            ui.msgContainer.innerHTML = '';
            data.history.forEach(renderMsg);
            scrollToBottom();
        });

        socket.on('new_message_arrived', (msg) => {
            // Auch anzeigen wenn anderer Raum (als Badge) - hier vereinfacht
            if(currentRoom) renderMsg(msg);
            scrollToBottom();
        });

        function sendMessage() {
            const txt = ui.msgInput.value.trim();
            if(!txt || !currentRoom) return;
            socket.emit('send_message_content', { text: txt, room: currentRoom, type: 'text' });
            ui.msgInput.value = '';
        }

        function quickAI() {
            const txt = ui.msgInput.value.trim();
            if(!txt) return alert("Schreibe erst eine Frage!");
            renderMsg({sender_id: myId, text: "@ai " + txt, time_str: 'Jetzt', type: 'text'});
            socket.emit('send_message_content', { text: "@ai " + txt, room: currentRoom, type: 'text' });
            ui.msgInput.value = '';
        }

        function renderMsg(m) {
            const isMe = m.sender_id === myId;
            const isAI = m.is_ai || m.sender_id === 'ai_bot';
            const isSys = m.type === 'system';

            const div = document.createElement('div');
            
            if(isSys) {
                div.className = 'flex justify-center mb-2';
                div.innerHTML = `<div class="msg-sys">${m.content}</div>`;
            } else {
                div.className = `flex w-full mb-1 ${isMe ? 'justify-end' : 'justify-start'} msg-anim`;
                const bubbleClass = isMe ? 'me' : (isAI ? 'ai' : 'other');
                
                let content = m.type === 'image' 
                    ? `<img src="${m.content}" class="img-msg" onclick="window.open(this.src)">` 
                    : `<div class="whitespace-pre-wrap">${m.text || m.content}</div>`;

                div.innerHTML = `
                    <div class="bubble ${bubbleClass}">
                        ${!isMe ? `<div class="text-[10px] font-bold mb-1 opacity-70 ${isAI ? 'text-purple-200' : 'text-sky-300'}">${m.sender_name || 'User'}</div>` : ''}
                        ${content}
                        <div class="text-[9px] text-right mt-1 opacity-50 flex items-center justify-end gap-1">
                            ${m.time_str || ''} ${isMe ? '<i class="fa-solid fa-check"></i>' : ''}
                        </div>
                    </div>
                `;
            }
            ui.msgContainer.appendChild(div);
        }

        function scrollToBottom() {
            ui.msgContainer.scrollTop = ui.msgContainer.scrollHeight;
        }

        // --- UTILS & MODALS ---
        function openModal(id) {
            document.getElementById(id).classList.add('open');
            if(id === 'settingsModal') document.getElementById('settingName').value = myName;
        }
        function closeModal(id) { document.getElementById(id).classList.remove('open'); }

        socket.on('system_notification', (d) => {
            // Einfacher Alert für Notifications
            alert(d.text);
        });

        // Enter Taste
        ui.msgInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
