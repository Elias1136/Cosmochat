<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CosmoChat Ultimate</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b0f19; color: #e2e8f0; font-family: sans-serif; overflow: hidden; }
        
        /* Neon Effekte */
        .neon-text { text-shadow: 0 0 10px #00ff88; }
        .neon-border { border: 1px solid #00ff88; box-shadow: 0 0 5px #00ff88; }
        
        .sidebar { background: #111827; width: 300px; border-right: 1px solid #1f2937; display: flex; flex-direction: column; }
        .chat-area { flex: 1; background: #0f172a; display: flex; flex-direction: column; position: relative; }
        
        .friend-item { cursor: pointer; transition: 0.2s; }
        .friend-item:hover { background: #1f2937; }
        .friend-item.active { background: #1f2937; border-left: 4px solid #00ff88; }
        
        .msg-me { background: #059669; color: white; align-self: flex-end; border-radius: 12px 12px 0 12px; }
        .msg-other { background: #1f2937; color: white; align-self: flex-start; border-radius: 12px 12px 12px 0; }
        .msg-ai { background: #7c3aed; color: white; align-self: flex-start; border-radius: 12px; border: 1px solid #a78bfa; }

        /* Anruf Overlay */
        #callOverlay { backdrop-filter: blur(10px); }
    </style>
</head>
<body class="flex h-screen w-full">

    <!-- LINKE SEITE: FREUNDE & PROFIL -->
    <div class="sidebar">
        <!-- Mein Profil Header -->
        <div class="p-4 border-b border-gray-800 bg-gray-900">
            <h1 class="text-2xl font-bold text-emerald-400 neon-text mb-2">CosmoChat</h1>
            <div class="flex justify-between items-center bg-gray-800 p-2 rounded-lg">
                <div>
                    <p class="text-[10px] text-gray-400 uppercase">Deine ID</p>
                    <p id="myIdDisplay" class="text-xl font-mono font-bold text-white tracking-widest">------</p>
                </div>
                <div class="w-3 h-3 bg-emerald-500 rounded-full shadow-[0_0_10px_#10b981]"></div>
            </div>
        </div>

        <!-- Freund hinzufügen -->
        <div class="p-4 border-b border-gray-800">
            <label class="text-xs text-gray-400 uppercase font-bold">Freund hinzufügen</label>
            <div class="flex gap-2 mt-1">
                <input type="text" id="friendIdInput" placeholder="6-stellige ID..." class="flex-1 bg-gray-800 border border-gray-700 rounded p-2 text-sm outline-none focus:border-emerald-500 text-white">
                <button onclick="addFriend()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 rounded text-sm font-bold transition"><i class="fa-solid fa-plus"></i></button>
            </div>
        </div>

        <!-- Freundesliste -->
        <div id="friendsList" class="flex-1 overflow-y-auto p-2 space-y-1">
            <!-- Hier erscheinen die Freunde -->
        </div>
    </div>

    <!-- RECHTE SEITE: CHAT -->
    <div class="chat-area">
        
        <!-- Chat Header (Mit Anruf Buttons) -->
        <header id="chatHeader" class="h-16 border-b border-gray-800 bg-gray-900 flex items-center justify-between px-6 hidden">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gray-700 rounded-full flex items-center justify-center text-xl">👤</div>
                <div>
                    <h3 id="currentChatName" class="font-bold text-white">Name</h3>
                    <p class="text-xs text-emerald-400">Online</p>
                </div>
            </div>
            <div class="flex gap-4">
                <button onclick="simulateCall('audio')" class="text-gray-400 hover:text-white p-2 rounded-full hover:bg-gray-800 transition"><i class="fa-solid fa-phone"></i></button>
                <button onclick="simulateCall('video')" class="text-gray-400 hover:text-white p-2 rounded-full hover:bg-gray-800 transition"><i class="fa-solid fa-video"></i></button>
            </div>
        </header>

        <!-- Willkommens-Bildschirm (Wenn kein Chat offen ist) -->
        <div id="welcomeScreen" class="flex-1 flex flex-col items-center justify-center text-gray-500">
            <i class="fa-solid fa-planet-ringed text-6xl mb-4 text-gray-700"></i>
            <p>Wähle einen Freund aus der Liste links aus.</p>
        </div>

        <!-- Nachrichten Fenster -->
        <div id="chatWindow" class="flex-1 overflow-y-auto p-6 space-y-3 hidden"></div>

        <!-- Eingabe -->
        <div id="chatInputArea" class="p-4 bg-gray-900 border-t border-gray-800 flex gap-3 hidden">
            <button onclick="askAI()" title="KI fragen" class="w-12 h-12 rounded-xl bg-purple-600 hover:bg-purple-500 text-white flex items-center justify-center transition shadow-[0_0_15px_rgba(124,58,237,0.3)]">
                <i class="fa-solid fa-robot text-xl"></i>
            </button>
            <input type="text" id="msgInput" placeholder="Nachricht schreiben..." class="flex-1 bg-gray-800 text-white rounded-xl px-4 outline-none focus:ring-2 focus:ring-emerald-500 transition">
            <button onclick="sendMessage()" class="w-12 h-12 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white flex items-center justify-center transition shadow-[0_0_15px_rgba(5,150,105,0.3)]">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <!-- Anruf Overlay (Simulation) -->
    <div id="callOverlay" class="fixed inset-0 bg-black/90 z-50 flex flex-col items-center justify-center hidden">
        <div class="w-32 h-32 bg-gray-700 rounded-full flex items-center justify-center text-4xl mb-4 animate-pulse">👤</div>
        <h2 class="text-2xl font-bold mb-2">Rufe an...</h2>
        <p id="callTarget" class="text-emerald-400 mb-10">Verbinde...</p>
        <button onclick="endCall()" class="w-16 h-16 bg-red-500 rounded-full flex items-center justify-center text-2xl hover:bg-red-600 transition shadow-[0_0_20px_red]">
            <i class="fa-solid fa-phone-slash"></i>
        </button>
    </div>

    <script>
        const socket = io();
        let myId = localStorage.getItem('cosmo_id');
        let currentRoom = null;

        // --- DOM Elemente ---
        const myIdDisplay = document.getElementById('myIdDisplay');
        const friendsList = document.getElementById('friendsList');
        const chatWindow = document.getElementById('chatWindow');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const chatHeader = document.getElementById('chatHeader');
        const chatInputArea = document.getElementById('chatInputArea');
        const currentChatName = document.getElementById('currentChatName');
        const msgInput = document.getElementById('msgInput');

        // --- Verbindung & Init ---
        socket.on('connect', () => {
            socket.emit('login', { id: myId });
        });

        socket.on('login_success', (data) => {
            myId = data.id;
            localStorage.setItem('cosmo_id', myId);
            myIdDisplay.textContent = myId;
            
            // Freunde rendern
            friendsList.innerHTML = '';
            data.friends.forEach(f => addFriendToList(f));
        });

        // --- Freund hinzufügen ---
        function addFriend() {
            const fid = document.getElementById('friendIdInput').value.trim();
            if(!fid) return;
            socket.emit('add_friend', { friend_id: fid });
            document.getElementById('friendIdInput').value = '';
        }

        socket.on('friend_added', (friend) => {
            addFriendToList(friend);
            alert(`Freund ${friend.name} hinzugefügt!`);
        });

        socket.on('error', (err) => {
            alert(err.msg);
        });

        function addFriendToList(friend) {
            const div = document.createElement('div');
            div.className = 'friend-item p-3 rounded-lg flex items-center gap-3 text-gray-300';
            div.onclick = () => selectFriend(friend.id, friend.name, div);
            div.innerHTML = `
                <div class="w-10 h-10 bg-gray-700 rounded-full flex items-center justify-center text-sm">👤</div>
                <div>
                    <div class="font-bold text-sm">${friend.name || 'Freund'}</div>
                    <div class="text-[10px] text-gray-500">ID: ${friend.id}</div>
                </div>
            `;
            friendsList.appendChild(div);
        }

        // --- Chat Auswahl ---
        function selectFriend(fid, name, element) {
            // UI anpassen
            document.querySelectorAll('.friend-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            
            welcomeScreen.classList.add('hidden');
            chatHeader.classList.remove('hidden');
            chatWindow.classList.remove('hidden');
            chatInputArea.classList.remove('hidden');
            
            currentChatName.textContent = name;
            
            // Chatraum betreten
            socket.emit('join_chat', { target_id: fid });
        }

        socket.on('chat_history', (data) => {
            currentRoom = data.room;
            chatWindow.innerHTML = '';
            data.messages.forEach(m => renderMessage(m));
            scrollToBottom();
        });

        socket.on('new_msg', (msg) => {
            if(msg.room && msg.room !== currentRoom) return; // Nur Nachrichten für aktuellen Raum
            renderMessage(msg);
            scrollToBottom();
        });

        // --- Nachrichten Senden ---
        function sendMessage() {
            const txt = msgInput.value.trim();
            if(!txt || !currentRoom) return;
            socket.emit('send_msg', { text: txt, room: currentRoom });
            msgInput.value = '';
        }

        function askAI() {
            const txt = msgInput.value.trim();
            if(!txt) return alert("Schreibe erst eine Frage für die KI!");
            // Sende als spezielle KI-Anfrage
            socket.emit('send_msg', { text: "@ai " + txt, room: currentRoom });
            msgInput.value = '';
        }

        function renderMessage(msg) {
            const isMe = msg.from === myId;
            const isAI = msg.from === 'ai';
            
            const div = document.createElement('div');
            div.className = `p-3 max-w-[70%] text-sm mb-2 ${isMe ? 'msg-me' : isAI ? 'msg-ai' : 'msg-other'}`;
            div.innerHTML = `
                ${isAI ? '<div class="text-[10px] font-bold text-purple-200 mb-1">🤖 CosmoAI</div>' : ''}
                ${msg.text}
                <div class="text-[9px] opacity-50 text-right mt-1">${msg.time || ''}</div>
            `;
            chatWindow.appendChild(div);
        }

        function scrollToBottom() {
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }
        
        msgInput.onkeypress = (e) => { if(e.key === 'Enter') sendMessage(); };

        // --- Anruf Simulation ---
        function simulateCall(type) {
            const overlay = document.getElementById('callOverlay');
            const targetName = currentChatName.textContent;
            document.getElementById('callTarget').textContent = type === 'video' ? `Videoanruf mit ${targetName}...` : `Anruf bei ${targetName}...`;
            overlay.classList.remove('hidden');
        }

        function endCall() {
            document.getElementById('callOverlay').classList.add('hidden');
        }
    </script>
</body>
</html>
