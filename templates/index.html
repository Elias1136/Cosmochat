<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CosmoChat Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* WhatsApp-ähnliche Farben */
        :root {
            --bg-color: #dadbd3;
            --chat-bg: #efeae2;
            --sidebar-bg: #ffffff;
            --my-bubble: #d9fdd3;
            --other-bubble: #ffffff;
            --ai-bubble: #f0f4ff;
        }

        body { background-color: var(--bg-color); font-family: -apple-system, sans-serif; height: 100vh; display: flex; overflow: hidden; }
        
        .main-container { width: 100%; height: 100%; display: flex; }
        
        /* Sidebar (Links) */
        .sidebar { width: 30%; min-width: 300px; background: var(--sidebar-bg); border-right: 1px solid #e0e0e0; display: flex; flex-direction: column; }
        
        /* Chat Bereich (Rechts) */
        .chat-view { flex: 1; background: var(--chat-bg); position: relative; display: flex; flex-direction: column; }
        
        /* Hintergrundbild-Muster */
        .chat-view::before {
            content: ""; position: absolute; width: 100%; height: 100%;
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            opacity: 0.06; pointer-events: none;
        }

        /* Nachrichten-Bubbles */
        .bubble { 
            max-width: 65%; padding: 6px 10px; border-radius: 8px; font-size: 14.2px; line-height: 19px; 
            box-shadow: 0 1px 0.5px rgba(0,0,0,0.13); margin-bottom: 4px; position: relative; z-index: 10;
        }
        .me { background: var(--my-bubble); align-self: flex-end; border-top-right-radius: 0; }
        .other { background: var(--other-bubble); align-self: flex-start; border-top-left-radius: 0; }
        .ai { background: var(--ai-bubble); border: 1px solid #d1d9ff; align-self: flex-start; border-top-left-radius: 0; }

        .time-stamp { font-size: 10px; color: #999; float: right; margin-left: 10px; margin-top: 5px; }

        /* Scrollbar schön machen */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #ced0d1; border-radius: 3px; }

        /* Handy-Anpassung */
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .sidebar.active { display: flex; width: 100%; }
            .chat-view { width: 100%; }
            .chat-view.hidden { display: none; }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- LINKES FENSTER: FREUNDE & EINSTELLUNGEN -->
        <div id="sidebarPanel" class="sidebar">
            <!-- Mein Profil Header -->
            <div class="bg-[#f0f2f5] p-3 flex justify-between items-center border-b border-gray-300">
                <div class="w-10 h-10 bg-gray-300 rounded-full flex items-center justify-center text-white text-xl">👤</div>
                <div class="flex gap-4 text-gray-500 text-lg">
                    <i class="fa-solid fa-circle-notch"></i>
                    <i class="fa-solid fa-message"></i>
                    <i class="fa-solid fa-ellipsis-vertical"></i>
                </div>
            </div>

            <!-- Suchleiste / ID Eingabe -->
            <div class="p-3 border-b border-gray-100">
                <div class="bg-[#f0f2f5] flex items-center rounded-lg px-3 py-2">
                    <i class="fa-solid fa-magnifying-glass text-gray-400 mr-3"></i>
                    <input type="text" id="friendId" placeholder="Freund-ID suchen..." class="bg-transparent outline-none text-sm w-full">
                </div>
                <button onclick="addFriend()" class="mt-2 w-full bg-emerald-500 text-white py-1 rounded text-sm font-bold shadow hover:bg-emerald-600">Hinzufügen</button>
            </div>

            <!-- Eigene ID Anzeige -->
            <div class="p-4 bg-blue-50 text-center border-b border-blue-100">
                <span class="text-xs font-bold text-blue-400 uppercase tracking-widest">Deine ID</span>
                <div id="myIdDisplay" class="text-xl font-mono font-black text-blue-600">LÄDT...</div>
            </div>

            <!-- Freundesliste -->
            <div id="friendsList" class="flex-1 overflow-y-auto">
                <!-- Freunde erscheinen hier -->
            </div>
        </div>

        <!-- RECHTES FENSTER: CHAT -->
        <div id="chatPanel" class="chat-view">
            <!-- Chat Header -->
            <header class="bg-[#f0f2f5] p-3 flex items-center justify-between shadow-sm z-20">
                <div class="flex items-center gap-3">
                    <button class="md:hidden text-gray-500" onclick="showSidebar()"><i class="fa-solid fa-arrow-left"></i></button>
                    <div class="w-10 h-10 bg-emerald-500 rounded-full flex items-center justify-center text-white"><i class="fa-solid fa-users"></i></div>
                    <div>
                        <h3 class="font-bold text-gray-800 text-sm">Globaler Chat</h3>
                        <p class="text-xs text-gray-500 truncate">Alle Benutzer online</p>
                    </div>
                </div>
                <div class="flex gap-6 text-gray-500 text-lg mr-4">
                    <i class="fa-solid fa-video cursor-pointer hover:text-emerald-600"></i>
                    <i class="fa-solid fa-phone cursor-pointer hover:text-emerald-600"></i>
                    <i class="fa-solid fa-magnifying-glass border-l pl-4 border-gray-300"></i>
                </div>
            </header>

            <!-- Nachrichten -->
            <div id="messages" class="flex-1 overflow-y-auto p-4 md:px-16 flex flex-col gap-1 z-10">
                <!-- Chatverlauf -->
            </div>

            <!-- Eingabe -->
            <footer class="bg-[#f0f2f5] p-3 flex items-center gap-2 z-20">
                <button class="text-gray-500 text-2xl px-1 hover:text-gray-700"><i class="fa-regular fa-face-smile"></i></button>
                <button class="text-gray-500 text-2xl px-1 hover:text-gray-700"><i class="fa-solid fa-paperclip"></i></button>
                
                <!-- KI Button -->
                <button onclick="askAI()" class="w-10 h-10 bg-purple-600 hover:bg-purple-700 text-white rounded-full flex items-center justify-center shadow-md transition">
                    <i class="fa-solid fa-robot"></i>
                </button>

                <div class="flex-1">
                    <input type="text" id="msgInput" placeholder="Nachricht schreiben..." 
                           class="w-full bg-white rounded-lg py-2 px-4 text-sm outline-none border-none shadow-sm focus:ring-1 focus:ring-emerald-500">
                </div>
                
                <button onclick="sendMessage()" class="text-emerald-600 text-2xl px-2 hover:scale-110 transition"><i class="fa-solid fa-paper-plane"></i></button>
            </footer>
        </div>
    </div>

    <script>
        const socket = io();
        const messagesDiv = document.getElementById('messages');
        const msgInput = document.getElementById('msgInput');
        const myIdDisplay = document.getElementById('myIdDisplay');
        
        let myId = localStorage.getItem('cosmo_pro_id');

        // --- VERBINDUNG ---
        socket.on('connect', () => {
            socket.emit('user_connect', { id: myId });
            socket.emit('load_history');
        });

        socket.on('init_data', (data) => {
            myId = data.id;
            localStorage.setItem('cosmo_pro_id', myId);
            myIdDisplay.innerText = myId;
            // Hier könnten wir Freunde rendern, wenn wir sie vom Server bekommen
        });

        // --- NACHRICHTEN ---
        socket.on('chat_history', (msgs) => {
            messagesDiv.innerHTML = '';
            msgs.forEach(m => renderMessage(m));
            scrollToBottom();
        });

        socket.on('receive_message', (msg) => {
            renderMessage(msg);
            scrollToBottom();
        });

        function sendMessage() {
            const text = msgInput.value.trim();
            if (!text) return;
            socket.emit('send_message', { text: text });
            msgInput.value = '';
        }

        function askAI() {
            const text = msgInput.value.trim();
            if (!text) return alert("Schreibe erst eine Frage!");
            socket.emit('ask_ai', { text: text });
            msgInput.value = '';
        }

        function renderMessage(msg) {
            const isMe = msg.from_id === myId;
            const isAI = msg.is_ai || msg.from_id === 'ai_bot';
            
            const div = document.createElement('div');
            div.className = `bubble ${isMe ? 'me' : isAI ? 'ai' : 'other'}`;
            
            // Name anzeigen wenn nicht ich
            let nameTag = '';
            if (!isMe) {
                const name = isAI ? 'CosmoAI 🤖' : 'User ' + msg.from_id;
                const color = isAI ? 'text-purple-600' : 'text-orange-600';
                nameTag = `<div class="text-[11px] font-bold ${color} mb-1">${name}</div>`;
            }

            div.innerHTML = `
                ${nameTag}
                <div>${msg.text}</div>
                <div class="time-stamp">${msg.time} ${isMe ? '<i class="fa-solid fa-check-double text-blue-400"></i>' : ''}</div>
            `;
            messagesDiv.appendChild(div);
        }

        function scrollToBottom() {
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // --- HANDY NAVIGATION ---
        function showSidebar() {
            document.getElementById('sidebarPanel').classList.add('active');
            document.getElementById('chatPanel').classList.add('hidden');
        }

        // Enter Taste
        msgInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Mobile Init
        if (window.innerWidth <= 768) {
            // Standardmäßig Chat anzeigen
            document.getElementById('sidebarPanel').classList.remove('active');
        }
    </script>
</body>
</html>
