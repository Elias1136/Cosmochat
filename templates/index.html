<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CosmoChat AI Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #e5e7eb; font-family: sans-serif; height: 100vh; overflow: hidden; display: flex; }
        .sidebar { width: 350px; background: white; border-right: 1px solid #d1d5db; display: flex; flex-direction: column; }
        .chat-view { flex: 1; background: #f3f4f6; position: relative; display: flex; flex-direction: column; }
        .bubble { max-width: 70%; padding: 10px 14px; border-radius: 12px; margin-bottom: 4px; font-size: 14px; position: relative; z-index: 10; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .me { background: #3b82f6; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .other { background: white; align-self: flex-start; border-bottom-left-radius: 2px; }
        .ai { background: #f3e8ff; border: 1px solid #d8b4fe; align-self: flex-start; color: #4c1d95; }
        .sys { background: #fef3c7; color: #92400e; font-size: 12px; align-self: center; border-radius: 20px; padding: 4px 12px; }
        
        /* Magic Menu */
        .magic-menu { position: absolute; bottom: 70px; left: 20px; background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); display: none; overflow: hidden; width: 200px; z-index: 50; }
        .magic-item { padding: 12px; cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 13px; color: #374151; transition: 0.2s; }
        .magic-item:hover { background: #f3f4f6; color: #2563eb; }
        .img-preview { border-radius: 8px; margin-top: 5px; max-width: 100%; border: 3px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        @media (max-width: 768px) { .sidebar { display: none; } }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="p-4 border-b flex items-center justify-between bg-gray-50">
            <h1 class="font-black text-xl text-blue-600 italic">CosmoAI</h1>
            <div id="idDisplay" class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-xs font-bold font-mono">...</div>
        </div>
        <div class="p-4">
            <div class="bg-gradient-to-r from-purple-500 to-indigo-600 rounded-xl p-4 text-white shadow-lg mb-4">
                <h3 class="font-bold text-sm mb-1"><i class="fa-solid fa-wand-magic-sparkles"></i> KI-Power aktiv</h3>
                <p class="text-[10px] opacity-90">Nutze den Zauberstab im Chat für Textverbesserungen!</p>
            </div>
            <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Kontakte</h3>
            <div class="p-3 hover:bg-gray-50 rounded-lg cursor-pointer flex items-center gap-3 border border-gray-100">
                <div class="w-10 h-10 bg-blue-500 rounded-full flex items-center justify-center text-white"><i class="fa-solid fa-earth-americas"></i></div>
                <div>
                    <div class="font-bold text-sm text-gray-700">Globaler Chat</div>
                    <div class="text-xs text-green-500">24/7 Online</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Chat -->
    <div class="chat-view">
        <!-- Magic AI Menu -->
        <div id="magicMenu" class="magic-menu">
            <div class="magic-item" onclick="transform('professional')"><i class="fa-solid fa-briefcase text-blue-500"></i> Professionell</div>
            <div class="magic-item" onclick="transform('funny')"><i class="fa-solid fa-face-laugh-beam text-yellow-500"></i> Lustig machen</div>
            <div class="magic-item" onclick="transform('english')"><i class="fa-solid fa-language text-green-500"></i> Translate (EN)</div>
        </div>

        <div class="bg-white p-4 shadow-sm z-10 flex justify-between items-center">
            <h2 class="font-bold text-gray-700">Global Lounge</h2>
            <span class="text-xs bg-green-100 text-green-700 px-2 py-1 rounded-full">Live</span>
        </div>

        <div id="board" class="flex-1 overflow-y-auto p-4 flex flex-col gap-2"></div>

        <div class="bg-white p-3 flex items-center gap-2 border-t">
            <!-- Magic Button -->
            <button onclick="toggleMagic()" class="w-10 h-10 rounded-full bg-gradient-to-r from-purple-500 to-pink-500 text-white shadow hover:scale-105 transition"><i class="fa-solid fa-wand-magic-sparkles"></i></button>
            
            <input type="text" id="inp" placeholder="Nachricht oder /imagine..." class="flex-1 p-3 bg-gray-100 rounded-xl outline-none focus:ring-2 focus:ring-blue-400 transition">
            
            <!-- AI Chat Button -->
            <button onclick="askAI()" class="w-10 h-10 rounded-full bg-gray-200 text-gray-600 hover:bg-gray-300 transition"><i class="fa-solid fa-robot"></i></button>
            <!-- Send Button -->
            <button onclick="send()" class="w-10 h-10 rounded-full bg-blue-600 text-white shadow hover:bg-blue-700 transition"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        const socket = io(); 
        const board = document.getElementById('board');
        const inp = document.getElementById('inp');
        const magicMenu = document.getElementById('magicMenu');
        let myId = localStorage.getItem('cosmo_ai_id');

        socket.on('connect', () => {
            socket.emit('user_connect', { id: myId });
            socket.emit('load_history');
        });

        socket.on('init_data', (d) => {
            myId = d.id;
            localStorage.setItem('cosmo_ai_id', myId);
            document.getElementById('idDisplay').textContent = myId;
        });

        socket.on('chat_history', (msgs) => {
            board.innerHTML = '';
            msgs.forEach(m => draw(m));
            scroll();
        });

        socket.on('receive_message', (m) => { draw(m); scroll(); });

        // --- KI Transformation ---
        function toggleMagic() {
            if(magicMenu.style.display === 'block') {
                magicMenu.style.display = 'none';
            } else {
                if(!inp.value.trim()) return alert("Schreibe erst einen Text zum Verwandeln!");
                magicMenu.style.display = 'block';
            }
        }

        function transform(mode) {
            const text = inp.value.trim();
            if(text) {
                // Zeige Lade-Indikator im Input
                const oldText = inp.value;
                inp.value = "✨ KI arbeitet...";
                inp.disabled = true;
                
                socket.emit('transform_text', { text: text, mode: mode });
                magicMenu.style.display = 'none';
            }
        }

        socket.on('transform_result', (data) => {
            inp.value = data.result;
            inp.disabled = false;
            inp.focus();
        });

        // --- Standard Funktionen ---
        function send() {
            const t = inp.value.trim();
            if(t) { socket.emit('send_message', { text: t }); inp.value = ''; }
        }

        function askAI() {
            const t = inp.value.trim();
            if(t) { socket.emit('ask_ai', { text: t }); inp.value = ''; }
        }

        function draw(m) {
            const isMe = m.from === myId;
            const isAI = m.is_ai || m.from === 'ai_bot';
            const isSys = m.from === 'sys';
            
            const div = document.createElement('div');
            
            if (isSys) {
                div.className = 'sys';
                div.innerText = m.text;
            } else {
                div.className = `bubble ${isMe ? 'me' : isAI ? 'ai' : 'other'}`;
                
                let content = `<div>${m.text}</div>`;
                if(m.img) content += `<img src="${m.img}" class="img-preview" onclick="window.open(this.src)">`;
                
                div.innerHTML = `
                    ${!isMe && !isAI ? `<div class="text-[10px] font-bold mb-1 opacity-70">User ${m.from}</div>` : ''}
                    ${isAI ? `<div class="text-[10px] font-bold mb-1 text-purple-700 flex items-center gap-1"><i class="fa-solid fa-robot"></i> CosmoAI</div>` : ''}
                    ${content}
                    <div class="text-[9px] opacity-60 text-right mt-1">${m.time}</div>
                `;
            }
            board.appendChild(div);
        }

        function scroll() { board.scrollTop = board.scrollHeight; }
        inp.onkeypress = (e) => { if(e.key === 'Enter') send(); };
        
        // Klick außerhalb schließt Magic Menu
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.magic-menu') && !e.target.closest('button[onclick="toggleMagic()"]')) {
                magicMenu.style.display = 'none';
            }
        });
    </script>
</body>
</html>
