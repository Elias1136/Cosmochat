<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CosmoChat</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white; 
        }
        .chat-area { height: 60vh; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">
    
    <div class="w-full max-w-2xl bg-slate-800/50 backdrop-blur-md rounded-2xl shadow-2xl border border-slate-700 overflow-hidden">
        <!-- Header -->
        <div class="bg-slate-800 p-6 border-b border-slate-700">
            <h1 class="text-3xl font-extrabold text-blue-400">CosmoChat <span class="text-xs font-normal text-slate-400">v2.0</span></h1>
            <p class="text-slate-400 text-sm mt-1">Dein Echtzeit-Chat im Web.</p>
        </div>

        <!-- Chat Verlauf -->
        <div id="chat-window" class="chat-area overflow-y-auto p-6 space-y-4">
            <div class="bg-blue-600 self-start p-4 rounded-2xl rounded-tl-none max-w-[85%] shadow-lg">
                Willkommen bei CosmoChat! Sobald du eine Nachricht schreibst, erscheint sie hier.
            </div>
        </div>

        <!-- Eingabe -->
        <div class="p-6 bg-slate-900/80 border-t border-slate-700">
            <div class="flex gap-3">
                <input type="text" id="user-input" placeholder="Schreibe eine Nachricht..." 
                       class="flex-1 bg-slate-700 border border-slate-600 rounded-xl p-4 outline-none text-white transition-all focus:ring-2 focus:ring-blue-500">
                <button onclick="sendMessage()" class="bg-blue-500 hover:bg-blue-600 px-8 py-4 rounded-xl font-bold transition-all shadow-lg shadow-blue-500/20">
                    Senden
                </button>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('user-input');

        socket.on('connect', () => {
            socket.emit('user_connect', { id: localStorage.getItem('cosmo_id') });
        });

        socket.on('init_data', (data) => {
            localStorage.setItem('cosmo_id', data.id);
            console.log("Verbunden mit ID:", data.id);
        });

        socket.on('new_message', (msg) => {
            appendMessage(msg.from_id === localStorage.getItem('cosmo_id') ? 'user' : 'other', msg.text);
        });

        function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;
            socket.emit('send_message', { text: text, room: 'global' });
            userInput.value = '';
        }

        function appendMessage(sender, text) {
            const div = document.createElement('div');
            if (sender === 'user') {
                div.className = 'bg-slate-700 self-end p-4 rounded-2xl rounded-tr-none max-w-[85%] ml-auto text-right shadow-md border border-slate-600';
            } else {
                div.className = 'bg-blue-600 self-start p-4 rounded-2xl rounded-tl-none max-w-[85%] shadow-md';
            }
            div.innerText = text;
            chatWindow.appendChild(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
