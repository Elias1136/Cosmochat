<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CosmoChat Sky</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f9ff; color: #0c4a6e; height: 100vh; display: flex; overflow: hidden; }
        .side { background-color: #e0f2fe; width: 300px; border-right: 2px solid #bae6fd; }
        .msg-me { background-color: #0ea5e9; color: white; border-radius: 15px 15px 0 15px; }
        .msg-other { background-color: #e2e8f0; color: #1e293b; border-radius: 15px 15px 15px 0; }
        .ai-btn { background-color: #a855f7; color: white; }
    </style>
</head>
<body class="flex-col md:flex-row w-full">
    <div class="side p-6 flex flex-col overflow-y-auto shrink-0">
        <h1 class="text-2xl font-black text-sky-600 italic mb-4">COSMOCHAT</h1>
        <div id="idBadge" class="bg-white p-2 rounded-xl text-center font-bold text-sky-700 border border-sky-200 text-xs mb-4">ID: lädt...</div>
        <p class="text-[10px] text-sky-400 font-bold uppercase">Status</p>
        <p class="text-xs text-sky-600 mb-4">Verbunden mit Google Cloud</p>
    </div>
    <div class="flex-1 flex flex-col bg-white">
        <div id="chat" class="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50"></div>
        <div class="p-4 border-t-2 border-sky-50 flex items-center gap-2">
            <button onclick="askAI()" class="ai-btn w-12 h-12 rounded-xl flex items-center justify-center shrink-0 shadow-lg"><i class="fa-solid fa-robot"></i></button>
            <input type="text" id="msgInp" placeholder="Schreibe etwas..." class="flex-1 p-3 bg-slate-100 rounded-xl outline-none focus:ring-2 focus:ring-sky-300">
            <button onclick="send()" class="bg-sky-500 text-white px-6 py-3 rounded-xl font-bold shadow-lg">SENDEN</button>
        </div>
    </div>
    <script>
        const socket = io();
        const chat = document.getElementById('chat');
        const inp = document.getElementById('msgInp');
        let myId = localStorage.getItem('cosmo_id');
        socket.on('connect', () => { socket.emit('user_connect', { id: myId }); socket.emit('load_history'); });
        socket.on('init_data', d => { myId = d.id; localStorage.setItem('cosmo_id', myId); document.getElementById('idBadge').textContent = "ID: " + d.id; });
        socket.on('chat_history', msgs => { chat.innerHTML = ''; msgs.forEach(m => add(m)); });
        socket.on('receive_message', m => add(m));
        function send() { if(inp.value.trim()){ socket.emit('send_message', { text: inp.value }); inp.value = ''; } }
        function askAI() { if(inp.value.trim()){ socket.emit('ask_ai', { text: inp.value }); inp.value = ''; } else { alert("Frag erst etwas!"); } }
        function add(m) {
            const isMe = m.from_id === myId;
            const d = document.createElement('div');
            d.className = `flex w-full ${isMe ? 'justify-end' : 'justify-start'}`;
            d.innerHTML = `<div class="max-w-[80%] p-3 shadow-sm ${isMe ? 'msg-me' : 'msg-other'}"><p class="text-sm">${m.text}</p></div>`;
            chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
        }
        inp.onkeypress = e => { if(e.key === 'Enter') send(); };
    </script>
</body>
</html>
