<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Globe Link | Connecting World Seamlessly</title>
    
    <!-- Design Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- Tailwind Config für Globe Link Farben -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        globe: {
                            dark: '#050b14',
                            panel: '#0f172a',
                            accent: '#0ea5e9', // Blue from Logo
                            success: '#10b981', // Green from Logo
                            ai: '#a855f7' // Purple for Gemini
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                        'spin-slow': 'spin 15s linear infinite',
                        'spin-reverse': 'spin-reverse 20s linear infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        'spin-reverse': {
                            from: { transform: 'rotate(360deg)' },
                            to: { transform: 'rotate(0deg)' }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom Styles & Scrollbars */
        body {
            background-color: #050b14;
            color: #f1f5f9;
            overflow: hidden; /* App Feeling */
        }
        
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        .glass-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Loading Screen Animation */
        .loader-bar {
            width: 0%;
            height: 4px;
            /* Gradient matching the Logo (Blue -> Green) */
            background: linear-gradient(90deg, #0ea5e9, #10b981);
            transition: width 3.5s ease-in-out;
            border-radius: 2px;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.5);
        }

        .text-gradient {
            background: linear-gradient(135deg, #0ea5e9 0%, #10b981 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .chat-bubble {
            position: relative;
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 20px;
            font-size: 0.95rem;
            line-height: 1.5;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.9) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .bubble-me { background: #0ea5e9; color: #fff; border-bottom-right-radius: 4px; margin-left: auto; }
        .bubble-other { background: #1e293b; color: #fff; border-bottom-left-radius: 4px; border: 1px solid #334155; }
        .bubble-ai { background: linear-gradient(135deg, #6b21a8, #a855f7); color: white; border-bottom-left-radius: 4px; border: 1px solid #c084fc; }

        /* Recording Pulse */
        .recording-pulse {
            animation: recordPulse 1.5s infinite;
        }
        @keyframes recordPulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        
        .hidden-force { display: none !important; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col font-sans">

    <!-- 1. LOADING SCREEN -->
    <div id="loadingScreen" class="fixed inset-0 z-50 bg-globe-dark flex flex-col items-center justify-center transition-opacity duration-1000">
        <!-- Animated Logo Container -->
        <div class="relative mb-8 w-48 h-48 flex items-center justify-center">
            <div class="absolute inset-0 bg-blue-500/10 blur-3xl rounded-full"></div>
            
            <svg viewBox="0 0 200 200" class="w-full h-full drop-shadow-[0_0_15px_rgba(16,185,129,0.4)]">
                <defs>
                    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" /> <!-- Blue -->
                        <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" /> <!-- Green -->
                    </linearGradient>
                </defs>
                <circle cx="100" cy="100" r="15" fill="url(#logoGrad)" opacity="0.8" class="animate-pulse"></circle>
                <g class="animate-spin-slow" style="transform-origin: 100px 100px;">
                    <ellipse cx="100" cy="100" rx="80" ry="35" stroke="url(#logoGrad)" stroke-width="6" fill="none" transform="rotate(45 100 100)" stroke-linecap="round" opacity="0.9"/>
                    <circle cx="160" cy="160" r="4" fill="#10b981" transform="rotate(45 100 100)"/>
                </g>
                <g class="animate-spin-reverse" style="transform-origin: 100px 100px;">
                    <ellipse cx="100" cy="100" rx="80" ry="35" stroke="url(#logoGrad)" stroke-width="6" fill="none" transform="rotate(-45 100 100)" stroke-linecap="round" opacity="0.8"/>
                     <circle cx="40" cy="40" r="4" fill="#0ea5e9" transform="rotate(-45 100 100)"/>
                </g>
                <g class="animate-spin-slow" style="animation-duration: 25s; transform-origin: 100px 100px;">
                    <ellipse cx="100" cy="100" rx="80" ry="25" stroke="url(#logoGrad)" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.7"/>
                </g>
                <circle cx="100" cy="20" r="3" fill="#10b981" class="animate-bounce" />
                <circle cx="180" cy="100" r="3" fill="#0ea5e9" class="animate-pulse" />
                <circle cx="20" cy="100" r="3" fill="#0ea5e9" class="animate-pulse" />
            </svg>
        </div>

        <h1 class="text-4xl font-bold tracking-[0.1em] text-gradient mb-2 drop-shadow-sm">GLOBE LINK</h1>
        <p class="text-slate-400 text-xs tracking-[0.3em] mb-12 uppercase">Connecting.Worlds.Seamlessly</p>
        
        <div id="progressContainer" class="flex flex-col items-center w-full max-w-xs">
            <div class="w-full h-1.5 bg-slate-800/50 rounded-full overflow-hidden backdrop-blur-sm border border-slate-700/50">
                <div id="progressBar" class="loader-bar"></div>
            </div>
            <p id="loadingText" class="mt-4 text-[10px] text-slate-500 font-mono tracking-widest">INITIALIZING NETWORK...</p>
        </div>
    </div>

    <!-- 2. MAIN APP CONTAINER -->
    <div id="appContainer" class="flex-1 flex overflow-hidden opacity-0 transition-opacity duration-1000">
        
        <!-- LEFT SIDEBAR -->
        <div class="w-full md:w-[380px] bg-globe-panel border-r border-slate-700 flex flex-col z-20 flex-shrink-0">
            
            <div class="p-6 border-b border-slate-700 bg-slate-900/50">
                <div class="flex items-center gap-4">
                    <div class="w-14 h-14 rounded-full bg-gradient-to-br from-cyan-500 to-green-500 flex items-center justify-center text-white text-xl font-bold shadow-lg" id="myAvatar">
                        U
                    </div>
                    <div class="flex-1">
                        <label class="text-[10px] text-slate-400 uppercase font-bold tracking-wider mb-1 block">Dein Name</label>
                        <input type="text" id="myNameInput" placeholder="Name eingeben..." class="bg-slate-800/50 border border-slate-700 rounded-lg px-2 py-1 text-white font-bold text-sm outline-none w-full focus:border-green-400 focus:bg-slate-800 transition" onblur="saveName()">
                        
                        <div class="flex items-center gap-2 mt-2">
                            <span class="text-xs text-slate-400 uppercase font-bold tracking-wider">ID:</span>
                            <span id="myIDDisplay" class="font-mono text-green-400 text-sm bg-green-900/20 px-2 py-0.5 rounded cursor-pointer hover:bg-green-900/40 border border-green-500/20" onclick="copyId()" title="Klicken zum Kopieren">Loading...</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="p-4">
                <div class="bg-slate-800/50 rounded-xl p-3 border border-slate-700 flex gap-2 focus-within:border-blue-500/50 transition">
                    <input type="text" id="addFriendInput" placeholder="Freundes-ID eingeben (6-8 stellig)" class="bg-transparent w-full text-sm outline-none text-white placeholder-slate-500 font-mono">
                    <button onclick="addFriend()" class="text-blue-400 hover:text-white transition px-2"><i class="fa-solid fa-user-plus"></i></button>
                </div>
            </div>

            <div class="flex px-4 border-b border-slate-700">
                <button onclick="switchTab('friends')" id="tabFriends" class="flex-1 pb-3 text-sm font-medium text-blue-400 border-b-2 border-blue-400 transition">Freunde</button>
                <button onclick="switchTab('requests')" id="tabRequests" class="flex-1 pb-3 text-sm font-medium text-slate-500 hover:text-slate-300 transition relative">
                    Anfragen
                    <span id="reqBadge" class="hidden absolute top-0 right-8 w-2 h-2 bg-red-500 rounded-full"></span>
                </button>
            </div>

            <div id="friendsList" class="flex-1 overflow-y-auto p-2 space-y-1">
                <div class="p-8 text-center text-slate-600 text-sm">
                    <i class="fa-solid fa-users-slash text-2xl mb-2 opacity-50"></i><br>
                    Noch keine Freunde.<br>Teile deine ID!
                </div>
            </div>
        </div>

        <!-- RIGHT CHAT AREA -->
        <div id="chatArea" class="flex-1 bg-globe-dark relative flex flex-col min-w-0">
            <div class="absolute inset-0 opacity-10 pointer-events-none" style="background-image: radial-gradient(#10b981 1px, transparent 1px); background-size: 30px 30px;"></div>

            <!-- Empty State -->
            <div id="emptyChatState" class="absolute inset-0 flex flex-col items-center justify-center z-0 text-center p-4">
                <div class="w-32 h-32 mb-6 opacity-50">
                     <svg viewBox="0 0 200 200" class="w-full h-full">
                        <defs>
                            <linearGradient id="logoGradSmall" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                        <g class="animate-spin-slow" style="transform-origin: 100px 100px;">
                             <ellipse cx="100" cy="100" rx="80" ry="35" stroke="url(#logoGradSmall)" stroke-width="4" fill="none" transform="rotate(45 100 100)" />
                             <ellipse cx="100" cy="100" rx="80" ry="35" stroke="url(#logoGradSmall)" stroke-width="4" fill="none" transform="rotate(-45 100 100)" />
                        </g>
                    </svg>
                </div>
                <h2 class="text-3xl font-bold text-gradient mb-2">Globe Link</h2>
                <p class="text-slate-400 max-w-md">Wähle einen Freund aus der Liste oder füge jemanden hinzu, um eine sichere Verbindung aufzubauen.</p>
                
                <div class="mt-8 flex gap-4">
                    <button onclick="openGeminiChat()" class="px-6 py-3 bg-gradient-to-r from-purple-600 to-indigo-600 rounded-xl text-white font-bold hover:scale-105 transition shadow-lg shadow-purple-900/40 flex items-center gap-2 border border-purple-500/30">
                        <i class="fa-solid fa-robot"></i> Mit Gemini Chatten
                    </button>
                </div>
            </div>

            <!-- Active Chat Interface -->
            <div id="activeChatInterface" class="hidden flex-col h-full w-full z-10 bg-globe-dark/95 backdrop-blur-sm">
                
                <div class="h-16 border-b border-slate-800 flex items-center justify-between px-6 bg-slate-900/80">
                    <div class="flex items-center gap-3">
                        <button class="md:hidden text-slate-400 mr-2" onclick="closeChatMobile()"><i class="fa-solid fa-arrow-left"></i></button>
                        <div class="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center text-white font-bold" id="chatHeaderAvatar">?</div>
                        <div>
                            <h3 id="chatHeaderName" class="font-bold text-white leading-tight">User</h3>
                            <div class="flex items-center gap-1.5">
                                <span class="w-2 h-2 bg-green-500 rounded-full shadow-[0_0_8px_#22c55e]"></span>
                                <span class="text-xs text-slate-400 font-mono">SECURE CONNECTION</span>
                            </div>
                        </div>
                    </div>
                    <div class="flex gap-4 text-slate-400">
                        <button title="Audio Call" class="hover:text-blue-400 transition"><i class="fa-solid fa-phone"></i></button>
                        <button title="Video Call" class="hover:text-blue-400 transition"><i class="fa-solid fa-video"></i></button>
                        <button title="Settings" class="hover:text-white transition"><i class="fa-solid fa-ellipsis-vertical"></i></button>
                    </div>
                </div>

                <div id="messagesContainer" class="flex-1 overflow-y-auto p-4 space-y-4 scroll-smooth"></div>

                <div class="p-4 bg-slate-900 border-t border-slate-800">
                    <div id="aiContextBar" class="hidden mb-2 px-3 py-1 bg-purple-900/30 border border-purple-500/30 rounded text-xs text-purple-300 flex justify-between items-center">
                        <span><i class="fa-solid fa-wand-magic-sparkles mr-2"></i>Gemini Modus Aktiv</span>
                        <button onclick="toggleAIMode(false)" class="hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                    </div>

                    <div class="flex items-end gap-2 bg-slate-800/50 p-2 rounded-2xl border border-slate-700 focus-within:border-blue-500/50 transition">
                        <button onclick="toggleAIMode()" id="aiBtn" class="w-10 h-10 rounded-xl text-slate-400 hover:text-purple-400 hover:bg-purple-900/20 transition flex items-center justify-center shrink-0" title="Gemini AI">
                            <i class="fa-solid fa-robot"></i>
                        </button>
                        
                        <!-- Added ID for Logic -->
                        <button onclick="triggerImageUpload()" id="imgBtn" class="w-10 h-10 rounded-xl text-slate-400 hover:text-white hover:bg-slate-700 transition flex items-center justify-center shrink-0">
                            <i class="fa-solid fa-image"></i>
                        </button>
                        <input type="file" id="imgUpload" class="hidden" accept="image/*" onchange="handleImageUpload(this)">

                        <textarea id="msgInput" rows="1" placeholder="Nachricht schreiben..." class="flex-1 bg-transparent text-white p-2.5 text-sm outline-none resize-none max-h-32 placeholder-slate-500"></textarea>

                        <!-- Added ID for Logic -->
                        <button id="micBtn" onmousedown="startRecording()" onmouseup="stopRecording()" class="w-10 h-10 rounded-xl text-slate-400 hover:text-red-500 hover:bg-red-900/20 transition flex items-center justify-center shrink-0">
                            <i class="fa-solid fa-microphone"></i>
                        </button>

                        <button onclick="sendMessage()" class="w-10 h-10 rounded-xl bg-blue-600 text-white shadow-lg shadow-blue-900/30 hover:bg-blue-500 transition flex items-center justify-center shrink-0 hover:scale-105 active:scale-95">
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // --- 0. KONFIGURATION ---
        // HIER DEINEN API KEY EINFÜGEN:
        const GEMINI_API_KEY = "AIzaSyBJKSAz-0KZ4MOalGMHBSV2O6yNFonUIrQ"; 

        // --- 1. STATE MANAGEMENT ---
        const state = {
            user: { id: null, name: 'Anonym' },
            friends: [], 
            requests: [],
            currentChatId: null,
            isGeminiMode: false,
            currentTab: 'friends' // Neu: Status für aktiven Tab
        };

        // --- 2. AUDIO SYSTEM ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playStartupSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(220, audioCtx.currentTime); 
            osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 2);
            osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 3);
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 1);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 4);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 4);
        }

        function playMessageSound(type) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            if(type === 'sent') {
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else {
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            }
        }

        // --- 3. INIT & LOADING ---
        window.onload = () => {
            let savedId = localStorage.getItem('globe_uid');
            if(!savedId) {
                savedId = Math.floor(100000 + Math.random() * 900000).toString();
                localStorage.setItem('globe_uid', savedId);
            }
            state.user.id = savedId;
            state.user.name = localStorage.getItem('globe_name') || '';

            document.getElementById('myIDDisplay').innerText = state.user.id;
            if(state.user.name) {
                document.getElementById('myNameInput').value = state.user.name;
                document.getElementById('myAvatar').innerText = state.user.name[0].toUpperCase();
            }

            const bar = document.getElementById('progressBar');
            const text = document.getElementById('loadingText');

            setTimeout(() => { bar.style.width = "40%"; text.innerText = "ESTABLISHING SECURE HANDSHAKE..."; }, 500);
            setTimeout(() => { bar.style.width = "80%"; text.innerText = "LOADING USER MODULES..."; }, 2000);
            setTimeout(() => { 
                bar.style.width = "100%"; 
                playStartupSound();
                document.getElementById('loadingScreen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('loadingScreen').style.display = 'none';
                    document.getElementById('appContainer').style.opacity = '1';
                }, 1000);
            }, 3500);

            loadFriends();
        };

        function saveName() {
            const name = document.getElementById('myNameInput').value.trim();
            if(name) {
                state.user.name = name;
                localStorage.setItem('globe_name', name);
                document.getElementById('myAvatar').innerText = name[0].toUpperCase();
            }
        }

        // --- 4. DATA LOGIC & TAB SWITCHING ---
        // Neue Funktion für das Umschalten der Tabs
        function switchTab(tab) {
            state.currentTab = tab;
            const tabFriends = document.getElementById('tabFriends');
            const tabRequests = document.getElementById('tabRequests');
            
            if(tab === 'friends') {
                tabFriends.className = "flex-1 pb-3 text-sm font-medium text-blue-400 border-b-2 border-blue-400 transition";
                tabRequests.className = "flex-1 pb-3 text-sm font-medium text-slate-500 hover:text-slate-300 transition relative";
            } else {
                tabFriends.className = "flex-1 pb-3 text-sm font-medium text-slate-500 hover:text-slate-300 transition";
                tabRequests.className = "flex-1 pb-3 text-sm font-medium text-blue-400 border-b-2 border-blue-400 transition relative";
            }
            renderList();
        }

        function loadFriends() {
            const saved = localStorage.getItem('globe_friends');
            if(saved) state.friends = JSON.parse(saved);
            renderList();
        }

        function addFriend() {
            const id = document.getElementById('addFriendInput').value.trim();
            if(!id || id === state.user.id) return alert("Ungültige ID");
            const newFriend = {
                id: id,
                name: "User " + id.substr(0,4),
                messages: []
            };
            state.friends.push(newFriend);
            localStorage.setItem('globe_friends', JSON.stringify(state.friends));
            document.getElementById('addFriendInput').value = '';
            renderList();
        }

        // Umbenannt zu renderList, da sie nun beide Tabs verwaltet
        function renderList() {
            const list = document.getElementById('friendsList');
            list.innerHTML = '';

            if (state.currentTab === 'friends') {
                // Gemini immer im Freunde Tab anzeigen
                const geminiEl = document.createElement('div');
                geminiEl.className = "mt-4 p-3 flex items-center gap-3 rounded-xl cursor-pointer hover:bg-purple-900/20 border border-purple-500/20 mb-2";
                geminiEl.onclick = () => openGeminiChat();
                geminiEl.innerHTML = `
                     <div class="w-10 h-10 rounded-full bg-gradient-to-br from-purple-500 to-indigo-500 flex items-center justify-center text-white"><i class="fa-solid fa-robot"></i></div>
                     <div class="flex-1">
                        <h4 class="text-purple-300 font-bold">Gemini AI</h4>
                        <p class="text-xs text-purple-400/60">Immer bereit zu helfen</p>
                     </div>
                `;
                list.appendChild(geminiEl);

                if (state.friends.length === 0) {
                     const empty = document.createElement('div');
                     empty.className = "p-8 text-center text-slate-600 text-sm";
                     empty.innerHTML = `<i class="fa-solid fa-users-slash text-2xl mb-2 opacity-50"></i><br>Noch keine Freunde.<br>Teile deine ID!`;
                     list.appendChild(empty);
                } else {
                    state.friends.forEach(friend => {
                        const el = document.createElement('div');
                        el.className = `p-3 flex items-center gap-3 rounded-xl cursor-pointer transition hover:bg-slate-800 ${state.currentChatId === friend.id ? 'bg-slate-800 border-l-4 border-blue-500' : 'border-l-4 border-transparent'}`;
                        el.onclick = () => openChat(friend.id);
                        el.innerHTML = `
                            <div class="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center text-white font-bold">${friend.name[0]}</div>
                            <div class="flex-1 min-w-0">
                                <div class="flex justify-between">
                                    <h4 class="text-slate-200 font-medium truncate">${friend.name}</h4>
                                    <button onclick="event.stopPropagation(); deleteFriend('${friend.id}')" class="text-slate-600 hover:text-red-500 text-xs"><i class="fa-solid fa-trash"></i></button>
                                </div>
                                <p class="text-xs text-slate-500 truncate">Klicken zum Chatten</p>
                            </div>
                        `;
                        list.appendChild(el);
                    });
                }
            } else if (state.currentTab === 'requests') {
                // Logik für Anfragen-Tab
                if (state.requests.length === 0) {
                     const empty = document.createElement('div');
                     empty.className = "p-8 text-center text-slate-600 text-sm";
                     empty.innerHTML = `<i class="fa-solid fa-inbox text-2xl mb-2 opacity-50"></i><br>Keine offenen Anfragen.`;
                     list.appendChild(empty);
                } else {
                    // Hier würden Anfragen stehen, wenn wir ein Backend hätten
                }
            }
        }

        function deleteFriend(id) {
            if(confirm("Freund wirklich löschen?")) {
                state.friends = state.friends.filter(f => f.id !== id);
                localStorage.setItem('globe_friends', JSON.stringify(state.friends));
                if(state.currentChatId === id) {
                    document.getElementById('activeChatInterface').classList.add('hidden');
                    document.getElementById('emptyChatState').classList.remove('hidden');
                    state.currentChatId = null;
                }
                renderList();
            }
        }

        // --- 5. CHAT LOGIC ---
        function openChat(id) {
            state.currentChatId = id;
            const friend = state.friends.find(f => f.id === id);
            
            document.getElementById('emptyChatState').classList.add('hidden');
            document.getElementById('activeChatInterface').classList.remove('hidden');
            document.getElementById('activeChatInterface').classList.add('flex');
            
            // SHOW MIC & IMG for regular chat
            document.getElementById('micBtn').classList.remove('hidden-force');
            document.getElementById('imgBtn').classList.remove('hidden-force');
            
            document.getElementById('chatHeaderName').innerText = friend.name;
            document.getElementById('chatHeaderAvatar').innerText = friend.name[0];
            document.getElementById('chatHeaderAvatar').style.background = '#334155';

            renderMessages(friend.messages);
            renderList();
            
            if(window.innerWidth < 768) {
                document.querySelector('.w-full.md\\:w-\\[380px\\]').classList.add('hidden');
            }
        }

        function openGeminiChat() {
            state.currentChatId = 'gemini';
            document.getElementById('emptyChatState').classList.add('hidden');
            document.getElementById('activeChatInterface').classList.remove('hidden');
            document.getElementById('activeChatInterface').classList.add('flex');

            // HIDE MIC & IMG for Gemini
            document.getElementById('micBtn').classList.add('hidden-force');
            document.getElementById('imgBtn').classList.add('hidden-force');

            document.getElementById('chatHeaderName').innerText = "Gemini AI";
            document.getElementById('chatHeaderAvatar').innerHTML = '<i class="fa-solid fa-robot"></i>';
            document.getElementById('chatHeaderAvatar').style.background = 'linear-gradient(135deg, #6b21a8, #a855f7)';

            const msgs = localStorage.getItem('globe_gemini_msgs') ? JSON.parse(localStorage.getItem('globe_gemini_msgs')) : [{sender: 'ai', text: 'Hallo! Ich bin Gemini. Ich kann Texte schreiben, Bilder generieren (/image) oder einfach chatten.', type: 'text'}];
            renderMessages(msgs);
            
            if(window.innerWidth < 768) {
                document.querySelector('.w-full.md\\:w-\\[380px\\]').classList.add('hidden');
            }
        }

        function closeChatMobile() {
            document.querySelector('.w-full.md\\:w-\\[380px\\]').classList.remove('hidden');
            document.getElementById('activeChatInterface').classList.add('hidden');
        }

        function renderMessages(messages) {
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';
            
            messages.forEach(msg => {
                const bubble = document.createElement('div');
                bubble.className = `chat-bubble ${msg.sender === 'me' ? 'bubble-me' : (msg.sender === 'ai' ? 'bubble-ai' : 'bubble-other')}`;
                
                if(msg.type === 'text') {
                    bubble.innerText = msg.text;
                } else if (msg.type === 'image') {
                    bubble.innerHTML = `<img src="${msg.content}" class="rounded-lg max-w-full cursor-pointer hover:opacity-90">`;
                } else if (msg.type === 'audio') {
                    // Unique ID for this audio to avoid collisions
                    const audioId = 'audio_' + Math.random().toString(36).substr(2, 9);
                    // We store the Audio object temporarily or create it on click
                    bubble.innerHTML = `
                        <div class="flex items-center gap-3 cursor-pointer select-none" onclick="playAudioMsg('${msg.content}')">
                            <button class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center hover:bg-white/30 transition">
                                <i class="fa-solid fa-play text-sm ml-0.5"></i>
                            </button> 
                            <div class="flex flex-col">
                                <span class="font-bold text-xs">Sprachnachricht</span>
                                <span class="text-[10px] opacity-70">Klicken zum Abspielen</span>
                            </div>
                        </div>`;
                }
                
                container.appendChild(bubble);
            });
            container.scrollTop = container.scrollHeight;
        }
        
        // Helper to play base64 audio
        function playAudioMsg(base64) {
            try {
                const audio = new Audio(base64);
                audio.play();
            } catch(e) { console.error("Audio Play Error", e); }
        }

        // --- 6. SENDING & RECORDING ---
        let mediaRecorder;
        let audioChunks = [];

        async function startRecording() {
            try {
                // Request Mic Access
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                
                mediaRecorder.ondataavailable = event => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    // Convert to Base64 for localStorage simulation
                    const reader = new FileReader();
                    reader.readAsDataURL(audioBlob);
                    reader.onloadend = () => {
                        const base64data = reader.result;
                        appendMessage({ sender: 'me', content: base64data, type: 'audio' });
                    };
                    // Stop tracks to release mic
                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();
                document.getElementById('micBtn').classList.add('text-red-500', 'recording-pulse');
            } catch (err) {
                alert("Mikrofon-Zugriff verweigert oder nicht verfügbar.");
                console.error(err);
            }
        }

        function stopRecording() {
            if(mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
                document.getElementById('micBtn').classList.remove('text-red-500', 'recording-pulse');
            }
        }

        function toggleAIMode(force) {
            state.isGeminiMode = force !== undefined ? force : !state.isGeminiMode;
            const btn = document.getElementById('aiBtn');
            const bar = document.getElementById('aiContextBar');
            const input = document.getElementById('msgInput');
            
            if(state.isGeminiMode) {
                btn.classList.replace('text-slate-400', 'text-purple-400');
                bar.classList.remove('hidden');
                input.placeholder = "Frage Gemini etwas oder generiere Text...";
            } else {
                btn.classList.replace('text-purple-400', 'text-slate-400');
                bar.classList.add('hidden');
                input.placeholder = "Nachricht schreiben...";
            }
        }

        async function sendMessage() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if(!text) return;

            const myMsg = { sender: 'me', text: text, type: 'text' };
            appendMessage(myMsg);
            input.value = '';
            playMessageSound('sent');

            if(state.currentChatId === 'gemini') {
                showTypingIndicator();
                
                // --- GEMINI API INTEGRATION ---
                if (GEMINI_API_KEY) {
                    try {
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: text }] }]
                            })
                        });
                        
                        const data = await response.json();
                        removeTypingIndicator();

                        if (data.candidates && data.candidates[0].content) {
                            const reply = data.candidates[0].content.parts[0].text;
                             appendMessage({ sender: 'ai', text: reply, type: 'text' });
                        } else {
                             appendMessage({ sender: 'ai', text: "Fehler: Konnte keine Antwort generieren.", type: 'text' });
                        }

                    } catch (error) {
                        removeTypingIndicator();
                        console.error("Gemini Error:", error);
                        appendMessage({ sender: 'ai', text: "Verbindungsfehler zur AI.", type: 'text' });
                    }
                } else {
                    // Fallback Simulation
                    setTimeout(async () => {
                        removeTypingIndicator();
                        let responseText = "";
                        if(text.toLowerCase().startsWith('/image') || text.toLowerCase().includes('bild')) {
                            responseText = "Ich würde hier ein Bild generieren, wenn der API Key konfiguriert wäre. 🖼️ [Simuliertes Bild]";
                        } else {
                            responseText = "Das ist eine simulierte Antwort von Gemini. Um echte KI zu nutzen, trage deinen API Key im Code ein.";
                        }
                        appendMessage({ sender: 'ai', text: responseText, type: 'text' });
                    }, 1500);
                }

            } 
            else if (state.isGeminiMode) {
                toggleAIMode(false);
                showTypingIndicator();
                setTimeout(() => {
                    removeTypingIndicator();
                    const aiDraft = `[Gemini Vorschlag für "${text}"]: \n\n"Hey! Ich wollte dir nur sagen: ${text}..."`;
                    appendMessage({ sender: 'me', text: aiDraft, type: 'text' }); 
                }, 1000);
            }
            else {
                setTimeout(() => {
                   playMessageSound('receive');
                }, 1000);
            }
        }

        function appendMessage(msg) {
            let list;
            if(state.currentChatId === 'gemini') {
                list = localStorage.getItem('globe_gemini_msgs') ? JSON.parse(localStorage.getItem('globe_gemini_msgs')) : [];
                list.push(msg);
                localStorage.setItem('globe_gemini_msgs', JSON.stringify(list));
            } else {
                const friend = state.friends.find(f => f.id === state.currentChatId);
                friend.messages.push(msg);
                list = friend.messages;
                localStorage.setItem('globe_friends', JSON.stringify(state.friends));
            }
            renderMessages(list);
        }

        function showTypingIndicator() {
            const container = document.getElementById('messagesContainer');
            const div = document.createElement('div');
            div.id = 'typingInd';
            div.className = 'chat-bubble bubble-other opacity-50 text-xs italic flex gap-1';
            div.innerHTML = '<span class="animate-bounce">●</span><span class="animate-bounce" style="animation-delay:0.1s">●</span><span class="animate-bounce" style="animation-delay:0.2s">●</span>';
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function removeTypingIndicator() {
            const el = document.getElementById('typingInd');
            if(el) el.remove();
        }

        function handleImageUpload(input) {
            if(input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    appendMessage({ sender: 'me', content: e.target.result, type: 'image' });
                }
                reader.readAsDataURL(input.files[0]);
            }
        }
        function triggerImageUpload() { document.getElementById('imgUpload').click(); }

        function copyId() {
            navigator.clipboard.writeText(state.user.id);
            alert("ID kopiert: " + state.user.id);
        }
        
        document.getElementById('msgInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

    </script>
</body>
</html>
